<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Ad Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>YouTube Ad Blocker</h1>
      <p class="status">Active on YouTube only</p>
      <ul>
        <li>No other websites</li>
        <li>No telemetry</li>
        <li>Rules shipped with the app</li>
      </ul>
      <p class="hint">Enable the extension in Safari → Settings → Extensions, then allow YouTube.</p>
    </main>
  </body>
